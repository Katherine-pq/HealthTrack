config:
  aws:region: us-east-1
  healthtrack-aws:environment: production
  healthtrack-aws:desiredCount: 2
  healthtrack-aws:cpu: 512
  healthtrack-aws:memory: 1024
  healthtrack-aws:databaseVersion: "18.6"
  healthtrack-aws:backupRetentionDays: 7
